<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="512" viewBox="0 0 1280 512" role="img" aria-label="raven">
  <title>raven</title>
  <!--
    The banner is the logo, widened: the same rounded card, the same stair of
    diagonal bands in the same navy ramp, and the name set across the middle of
    the card.

    `logo.svg` draws the stair inside a 512-unit box as seven bands, each one
    step of 64 to the right of the last. The banner keeps that step, because the
    step is what makes the stair read as one object: a band starts on every
    multiple of 64. The card is 1152 wide, eighteen steps, and the stair runs
    seven steps past its left edge — to -448 — so the wedge below the first
    diagonal is banded like everything else instead of falling back on the card
    colour. That is twenty-seven bands, every one of them a step of 64 from the
    one before. The ramp is the logo's own sequence, repeated — #0e1424 #1a2542
    #26386b #3a5488 #1a2542 #22315c #07090f — and every band carries the logo's
    drop shadow, so the stair keeps the depth it has in the mark.

    The banner carries no mark: `logo.svg`'s white path is the R and the a
    together, and set beside a name it spells the name twice. The name is
    therefore the whole word, one string, centred on the card at 640 by 256 the
    way the reference banner centres its own.
  -->
  <defs>
    <clipPath id="round-rect">
      <rect x="64" y="64" width="1152" height="384" rx="96" ry="96"/>
    </clipPath>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="-10" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- The card, then the stair over it, the ramp running dark to light. The
       stair covers the card whole, so the card is only the logo background
       waiting underneath it. -->
  <rect x="64" y="64" width="1152" height="384" rx="96" ry="96" fill="#07090f"/>
  <path d="M -448 0 L 1280 0 L 1280 512 L 64 512 L -448 0 Z" fill="#0e1424" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M -384 0 L 1280 0 L 1280 512 L 128 512 L -384 0 Z" fill="#1a2542" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M -320 0 L 1280 0 L 1280 512 L 192 512 L -320 0 Z" fill="#26386b" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M -256 0 L 1280 0 L 1280 512 L 256 512 L -256 0 Z" fill="#3a5488" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M -192 0 L 1280 0 L 1280 512 L 320 512 L -192 0 Z" fill="#1a2542" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M -128 0 L 1280 0 L 1280 512 L 384 512 L -128 0 Z" fill="#22315c" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M -64 0 L 1280 0 L 1280 512 L 448 512 L -64 0 Z" fill="#07090f" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 0 0 L 1280 0 L 1280 512 L 512 512 L 0 0 Z" fill="#0e1424" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 64 0 L 1280 0 L 1280 512 L 576 512 L 64 0 Z" fill="#1a2542" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 128 0 L 1280 0 L 1280 512 L 640 512 L 128 0 Z" fill="#26386b" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 192 0 L 1280 0 L 1280 512 L 704 512 L 192 0 Z" fill="#3a5488" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 256 0 L 1280 0 L 1280 512 L 768 512 L 256 0 Z" fill="#1a2542" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 320 0 L 1280 0 L 1280 512 L 832 512 L 320 0 Z" fill="#22315c" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 384 0 L 1280 0 L 1280 512 L 896 512 L 384 0 Z" fill="#07090f" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 448 0 L 1280 0 L 1280 512 L 960 512 L 448 0 Z" fill="#0e1424" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 512 0 L 1280 0 L 1280 512 L 1024 512 L 512 0 Z" fill="#1a2542" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 576 0 L 1280 0 L 1280 512 L 1088 512 L 576 0 Z" fill="#26386b" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 640 0 L 1280 0 L 1280 512 L 1152 512 L 640 0 Z" fill="#3a5488" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 704 0 L 1280 0 L 1280 512 L 1216 512 L 704 0 Z" fill="#1a2542" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 768 0 L 1280 0 L 1280 512 Z" fill="#22315c" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 832 0 L 1280 0 L 1280 448 Z" fill="#07090f" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 896 0 L 1280 0 L 1280 384 Z" fill="#0e1424" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 960 0 L 1280 0 L 1280 320 Z" fill="#1a2542" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 1024 0 L 1280 0 L 1280 256 Z" fill="#26386b" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 1088 0 L 1280 0 L 1280 192 Z" fill="#3a5488" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 1152 0 L 1280 0 L 1280 128 Z" fill="#1a2542" clip-path="url(#round-rect)" filter="url(#shadow)"/>
  <path d="M 1216 0 L 1280 0 L 1280 64 Z" fill="#22315c" clip-path="url(#round-rect)" filter="url(#shadow)"/>

  <!-- The name, the whole word, centred on the card. A stroke rather than a
       heavier `font-weight`, because every viewer resolves a weight to a face of
       its own. -->
  <text x="640" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="227" font-weight="bold"
        fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"
        text-anchor="middle" dominant-baseline="central" filter="url(#shadow)">Raven</text>
</svg>
