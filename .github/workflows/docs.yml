name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "crates/raven-scratch/src/catalog.rs"
      - "crates/raven-asm/src/docs_gen.rs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Regenerate the block references from the catalog
        run: |
          cargo run --release -p raven-asm -- catalog --markdown > docs/reference/blocks.md
          git diff --exit-code docs/reference/blocks.md \
            || echo "::warning::the block references were out of date and have been regenerated"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build the site
        working-directory: docs
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
