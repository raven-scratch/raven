[workspace]
resolver = "2"
members = [
    "crates/raven",
    "crates/raven-asm",
    "crates/raven-scratch",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["DilemmaGX"]
repository = "https://github.com/raven-scratch/raven"
homepage = "https://github.com/raven-scratch/raven"
documentation = "https://raven-scratch.github.io/raven/"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"

[profile.release]
lto = true
strip = true
