# The machine carrying Linux: `tools/build.mjs` writes src/rv32/image.rav, and
# `node tools/build.mjs linux` is what puts this image in it.
[project]
name = "rv32linux"
output = "dist"
extensions = ["pen"]

[targets]
stage = "src/stage.rav"
sprites = [
    "src/sprites/riscv.rav",
    "src/sprites/terminal.rav",
    "src/sprites/input.rav",
]
