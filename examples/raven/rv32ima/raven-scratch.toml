# The same machine carrying the image the Scratch project itself ships: `node
# tools/build.mjs scratch` is what puts it in src/rv32/image.rav, and this
# manifest is what builds it into its own `.sb3`.
[project]
name = "rv32scratch"
output = "dist"
extensions = ["pen"]

[targets]
stage = "src/stage.rav"
sprites = [
    "src/sprites/riscv.rav",
    "src/sprites/terminal.rav",
    "src/sprites/input.rav",
]
